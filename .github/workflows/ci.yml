name: CI

# PR-time validation. No deploys here — those run from
# financedistrict-platform/fd-deployments via workflow_dispatch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm -r build

  docker-app:
    name: Verify App Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push) — apps/saleor-agentic-commerce-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/saleor-agentic-commerce-app/Dockerfile
          push: false
          # Pin platform to linux/amd64 for the CI runner; production builds
          # for ARM64 happen in fd-deployments on the self-hosted ARM runner.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
