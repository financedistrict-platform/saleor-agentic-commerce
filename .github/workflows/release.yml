name: Release

# Automated package releases via Changesets.
#
# How it works:
# - Contributors add a changeset with `pnpm changeset` describing their change
#   and the bump type per package (patch/minor/major).
# - On push to main, this workflow looks for pending changesets:
#     - If found, it opens (or updates) a "Version Packages" PR that consumes
#       the changesets, bumps versions in package.json, and updates CHANGELOGs.
#     - When that PR is merged, the workflow runs again, sees no pending
#       changesets, and instead publishes the bumped packages to npm.
#
# The PR is opened using a token minted from the FD CI GitHub App rather than
# the workflow's default GITHUB_TOKEN. The default token is deliberately
# prevented from triggering downstream workflows (anti-recursion), which means
# ci.yml never runs on bot-opened "Version Packages" PRs, leaving the required
# check missing and the PR un-mergeable without admin override. An App token
# does trigger downstream workflows, so the version-packages PR now runs
# through normal CI like any other PR.
#
# Requires:
# - FD_CI_APP_ID secret  — App ID of the FD CI GitHub App.
# - FD_CI_APP_KEY secret — Private key (.pem contents) for that App.
# - NPM_TOKEN secret     — publish access to @financedistrict/* on npm.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate FD CI app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FD_CI_APP_ID }}
          private-key: ${{ secrets.FD_CI_APP_KEY }}
          # Scope the minted installation token to this repo only, even
          # though the App may be installed org-wide. Limits blast radius
          # if release.yml is ever compromised.
          repositories: saleor-agentic-commerce

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
