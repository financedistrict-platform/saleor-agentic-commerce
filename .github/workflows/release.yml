name: Release

# Automated package releases via Changesets.
#
# How it works:
# - Contributors add a changeset with `pnpm changeset` describing their change
#   and the bump type per package (patch/minor/major).
# - On push to main, this workflow looks for pending changesets:
#     - If found, it opens (or updates) a "Version Packages" PR that consumes
#       the changesets, bumps versions in package.json, and updates CHANGELOGs.
#     - When that PR is merged, the workflow runs again, sees no pending
#       changesets, and instead publishes the bumped packages to npm.
#
# Note on bot-PR + CI: the "Version Packages" PR is opened with the default
# GITHUB_TOKEN, which by design does not trigger downstream workflows (an
# anti-recursion safeguard from GitHub). So ci.yml does not run on those
# PRs and the required "Lint, type-check, build" check stays missing. To
# unblock a release, push an empty commit to changeset-release/main with
# your own identity — that fires ci.yml under a human actor and clears the
# required check.
#
# This release flow is scheduled to move to financedistrict-platform/fd-deployments
# (internal repo) so the bot can authenticate as the FD CI GitHub App and
# trigger CI on its own PRs. The App's secrets live at the org level and
# are not reachable from public repos, so they cannot be wired up here.
#
# Requires:
# - NPM_TOKEN secret with publish access to @financedistrict/* on npm.
# - GITHUB_TOKEN (provided automatically) with contents:write + pull-requests:write.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
