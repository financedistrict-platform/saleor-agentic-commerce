name: Saleor Agentic Commerce App - Build & Deploy

# Builds the Saleor App control-plane (apps/saleor-agentic-commerce-app)
# and deploys it as the fd-saleor-agentic-app ECS service.
#
# Triggers:
#   - push to main → deploy to test
#   - workflow_dispatch → operator picks the environment
#
# Test/prod selection:
#   - default branch (main) implies test environment unless dispatched explicitly
#   - prod is workflow_dispatch only, gated by the `prod` GitHub Environment

on:
  push:
    branches: [main]
    paths:
      - "apps/saleor-agentic-commerce-app/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-deploy-agentic-commerce-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/saleor-agentic-commerce-app/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-deploy-agentic-commerce-app.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - test
          - prod
        default: "test"

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  setup:
    name: Determine Environment
    runs-on: [self-hosted, arm64]
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine target environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=test" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and Push
    needs: setup
    runs-on: [self-hosted, arm64]
    env:
      TARGET_ENV: ${{ needs.setup.outputs.environment }}
    environment: ${{ needs.setup.outputs.environment }}
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: 1stdigital/fd-infra/.github/actions/build-and-push-ecr@develop
        with:
          service_name: saleor-agentic-commerce-app
          environment: ${{ env.TARGET_ENV }}
          push_to_ecr: ${{ github.event_name != 'pull_request' }}
          # Build context is the monorepo root so the workspace metadata is
          # visible to pnpm during the deps stage.
          dockerfile_path: apps/saleor-agentic-commerce-app/Dockerfile
          build_context: .

  deploy:
    name: Deploy
    needs: [setup, build]
    if: github.event_name != 'pull_request'
    uses: 1stdigital/fd-infra/.github/workflows/deploy-ecs-service.yml@develop
    with:
      service_name: saleor-agentic-commerce-app
      terraform_targets: '["module.saleor_agentic_app"]'
      environment: ${{ needs.setup.outputs.environment }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      auto_approve: "true"
    secrets: inherit
